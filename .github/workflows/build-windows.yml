name: Gerar executavel Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Baixar ffmpeg e deno para Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          Copy-Item ff\*\bin\ffmpeg.exe, ff\*\bin\ffprobe.exe ffmpeg\
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath ffmpeg

      - name: Gerar YouTube-MP3.exe
        run: pyinstaller --onefile --name YouTube-MP3 --add-data "templates;templates" --add-data "ffmpeg;ffmpeg" app.py

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-MP3-Windows
          path: dist/YouTube-MP3.exe

      - name: Publicar na pagina de Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YouTube-MP3.exe
